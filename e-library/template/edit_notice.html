{% extends 'base.html' %}
{% block content %}
<div class="bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8 flex items-center gap-2">✏️ Edit Notice</h1>
    
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
                <select name="department" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept }}" {% if dept == notice.department %}selected{% endif %}>{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Title</label>
            <input type="text" name="title" value="{{ notice.title }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none" required>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Content</label>
            <textarea name="content" rows="6" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none resize-none" required>{{ notice.content }}</textarea>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">PDF File (Leave blank to keep existing)</label>
            <input type="file" name="pdf_file" accept="application/pdf" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none cursor-pointer">
            {% if notice.pdf %}
            <p class="text-xs text-gray-500 mt-2">Current file: <a href="{{ url_for('static', filename=notice.pdf) }}" target="_blank" class="text-blue-600 hover:underline font-semibold">Download PDF</a></p>
            {% else %}
            <p class="text-xs text-gray-500 mt-2">No PDF attached. Upload a PDF to attach to this notice (optional, max 50MB)</p>
            {% endif %}
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg">
                ✅ Update Notice
            </button>
            <a href="{{ url_for('notices') }}" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
