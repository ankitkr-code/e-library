{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h3 class="text-2xl font-bold text-gray-900 mb-2 flex items-center gap-2">✍️ Edit Syllabus Item</h3>
        <p class="text-gray-600 mb-8">Update syllabus details and PDF file</p>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
                    <input type="text" name="department" value="{{ item.department }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none" required>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Semester</label>
                    <input type="text" name="semester" value="{{ item.semester }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none" required>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Replace PDF (optional)</label>
                <input type="file" name="file" accept="application/pdf" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none cursor-pointer">
                <p class="text-xs text-gray-500 mt-2">Leave empty to keep the current PDF</p>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg">
                    💾 Save Changes
                </button>
                <a href="{{ url_for('syllabus') }}" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px]">
                    ❌ Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
