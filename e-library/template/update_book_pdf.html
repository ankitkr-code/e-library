{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h3 class="text-2xl font-bold text-gray-900 mb-2 flex items-center gap-2">📄 Update Book PDF</h3>
        <p class="text-gray-600 mb-8">Replace the PDF file for: <span class="font-semibold text-cyan-600">{{ book.title }}</span></p>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Book Title</label>
                <input type="text" value="{{ book.title }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed" disabled>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Upload New PDF</label>
                <input type="file" name="pdf_file" accept="application/pdf" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none cursor-pointer" required>
                <p class="text-xs text-gray-500 mt-2">📄 Only PDF files accepted (max 50MB)</p>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg">
                    ✅ Update PDF
                </button>
                <a href="{{ url_for('book_master') }}" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px]">
                    ❌ Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
