<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .outer-ring { fill: #0d4a7d; }
      .inner-circle { fill: #e63946; }
      .text-ring { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0d4a7d; letter-spacing: 0.5px; }
    </style>
  </defs>
  
  <!-- Outer Circle (Dark Teal) -->
  <circle cx="100" cy="100" r="95" class="outer-ring"/>
  
  <!-- Inner Red Circle -->
  <circle cx="100" cy="100" r="70" class="inner-circle"/>
  
  <!-- Stylized "ti" Symbol in White -->
  <g fill="white">
    <!-- Letter "t" - curved top with vertical stem -->
    <path d="M 75 65 Q 70 55 80 55 L 80 115 Q 80 120 75 120 L 70 120 Q 65 120 65 115 L 65 65 Q 65 60 70 60 L 75 60 Z" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M 65 70 L 95 70 Q 98 70 98 73 L 98 80 Q 98 82 95 82 L 70 82" fill="white"/>
    
    <!-- Letter "i" - dot and stem -->
    <circle cx="120" cy="60" r="6" fill="white"/>
    <rect x="115" y="85" width="10" height="35" rx="2" fill="white"/>
  </g>
  
  <!-- Outer Text Arc (Top) - DUMKA ENGINEERING -->
  <defs>
    <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  </defs>
  <text class="text-ring" font-size="11">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      DUMKA ENGINEERING
    </textPath>
  </text>
  
  <!-- Outer Text Arc (Bottom) - COLLEGE -->
  <defs>
    <path id="bottomArc" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>
  <text class="text-ring" font-size="11">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      COLLEGE
    </textPath>
  </text>
</svg>
