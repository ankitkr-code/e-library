{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h3 class="text-2xl font-bold text-gray-900 mb-2 flex items-center gap-2">🔐 Change Password</h3>
        <p class="text-gray-600 mb-8">Update your account password for better security</p>
        
        <form method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Current Password</label>
                <input type="password" name="current_password" placeholder="Enter your current password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none" required />
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">New Password</label>
                <input type="password" name="new_password" placeholder="Enter your new password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none" required />
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm New Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm your new password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none" required />
            </div>
            
            <button type="submit" class="bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg w-full">
                🔄 Update Password
            </button>
        </form>
        
        <div class="mt-6 p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500">
            <p class="text-xs text-blue-700"><strong>💡 Tip:</strong> Use a strong password with uppercase, lowercase, numbers, and special characters.</p>
        </div>
    </div>
</div>
{% endblock %}
