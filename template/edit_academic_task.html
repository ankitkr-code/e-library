{% extends 'base.html' %}
{% block content %}
<div class="bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8 flex items-center gap-2">✏️ Edit Task</h1>
    
    <form method="post" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Task Type</label>
                <select name="task_type" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" required>
                    <option value="assignment" {% if task.task_type == 'assignment' %}selected{% endif %}>📝 Assignment</option>
                    <option value="quiz" {% if task.task_type == 'quiz' %}selected{% endif %}>❓ Quiz</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
                <select name="department" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept }}" {% if dept == task.department %}selected{% endif %}>{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Title</label>
            <input type="text" name="title" value="{{ task.title }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" required>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea name="description" rows="6" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none resize-none" required>{{ task.description }}</textarea>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Due Date</label>
                <input type="date" name="due_date" value="{{ task.due_date }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" required>
            </div>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg">
                ✅ Update Task
            </button>
            <a href="{{ url_for('academic_tasks_view') }}" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
