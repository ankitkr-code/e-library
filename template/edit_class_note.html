{% extends 'base.html' %}
{% block content %}
<div class="bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8 flex items-center gap-2">✏️ Edit Class Note</h1>
    
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
                <select name="department" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept }}" {% if dept == note.department %}selected{% endif %}>{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Subject</label>
                <input type="text" name="subject" value="{{ note.subject }}" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none" required>
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">PDF File (Leave blank to keep existing)</label>
            <input type="file" name="file" accept="application/pdf" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none cursor-pointer">
            <p class="text-xs text-gray-500 mt-2">Current file: <a href="{{ url_for('static', filename=note.file) }}" target="_blank" class="text-purple-600 hover:underline">View PDF</a></p>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg">
                ✅ Update Note
            </button>
            <a href="{{ url_for('class_notes_view') }}" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
