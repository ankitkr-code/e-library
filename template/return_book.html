{% extends 'base.html' %}
{% block content %}
<!-- Return Form -->
<div class="bg-white rounded-xl shadow-lg p-8 mb-8">
    <h3 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2">📥 Return a Book</h3>
    
    <form method="post" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Issued Record</label>
                <select name="issue_id" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none" required>
                    <option value="">Select a record...</option>
                    {% for issue in issued_books %}
                    {%- set student_name = '' -%}
                    {%- for student in students -%}
                        {%- if student.username == issue.student -%}
                            {%- set student_name = student.name -%}
                        {%- endif -%}
                    {%- endfor -%}
                    <option value="{{ issue.id }}">ID {{ issue.id }} - {{ student_name or issue.student }} / {{ issue.book }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Return Date</label>
                <input type="date" name="return_date" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none" required />
            </div>
        </div>
        
        <button type="submit" class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg">
            📥 Return Book
        </button>
    </form>
</div>
{% endblock %}
