<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEC Smart Scholar Hub - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a365d 0%, #2d5a8c 50%, #c9631e 100%);
            min-height: 100vh;
        }

        .register-container {
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .register-card {
            background: white;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        input {
            transition: all 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .btn-register {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(245, 158, 11, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
            overflow: hidden;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="register-container w-full max-w-2xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="logo mx-auto mb-6">
                <img src="{{ url_for('static', filename='dec_logo/WhatsApp Image 2026-06-04 at 20.44.33.png') }}" alt="DEC Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">DEC Scholar Hub</h1>
            <p class="text-amber-200 text-lg">Smart Knowledge Gateway</p>
        </div>

        <!-- Register Card -->
        <div class="register-card rounded-2xl p-8">
            <h2 class="text-3xl font-bold text-gray-900 text-center mb-2">Student Registration</h2>
            <p class="text-gray-500 text-center mb-8">Register to access the library (admin approval required)</p>

            <form method="POST" class="space-y-5">
                <!-- Full Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name *</label>
                    <input type="text" name="name" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Your full name" required>
                </div>

                <!-- Registration Number -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Registration Number *</label>
                    <input type="text" name="registration_no" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Your registration number" required>
                </div>

                <!-- Department -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Department *</label>
                    <select name="department" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" required>
                        <option value="">Select your department</option>
                        <option value="CSE">Computer Science & Engineering (CSE)</option>
                        <option value="ECE">Electronics & Communication (ECE)</option>
                        <option value="Civil">Civil Engineering</option>
                        <option value="Mechanical">Mechanical Engineering</option>
                        <option value="Electrical">Electrical Engineering</option>
                        <option value="BCA">Bachelor of Computer Applications (BCA)</option>
                    </select>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email *</label>
                    <input type="email" name="email" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Your email address" required>
                </div>

                <!-- Username -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Username *</label>
                    <input type="text" name="username" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Choose a username" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Create a strong password" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none" placeholder="Confirm your password" required>
                </div>

                {% if error %}
                    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded">
                        {{ error }}
                    </div>
                {% endif %}

                <button type="submit" class="btn-register w-full text-white font-bold py-3 rounded-lg mt-6">
                    Create Account
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-gray-200 text-center">
                <p class="text-gray-600">Already have an account? 
                    <a href="{{ url_for('login') }}" class="text-amber-600 font-semibold hover:text-amber-700 transition">
                        Sign in here
                    </a>
                </p>
                <p class="text-gray-600 mt-4">
                    <a href="{{ url_for('home') }}" class="text-gray-500 hover:text-gray-700 transition">
                        ← Back to Home
                    </a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-amber-100 text-sm">
            <p>&copy; 2025 DEC Smart Scholar Hub. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
