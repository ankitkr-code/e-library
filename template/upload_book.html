{% extends 'base.html' %}
{% block content %}
<div class="bg-white rounded-xl shadow-lg p-8">
    <h3 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2">⬆️ Upload Book with PDF</h3>
    <p class="text-gray-600 mb-8">Add a new book to the library with its PDF content</p>
    
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Book Title</label>
                <input type="text" name="title" placeholder="Enter book title" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none" required />
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Author</label>
                <input type="text" name="author" placeholder="Enter author name" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none" required />
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                <select name="category" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none" required>
                    <option value="">Select a category...</option>
                    <option value="Coding">Coding</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Science">Science</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Civil">Civil</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">ISBN</label>
                <input type="text" name="isbn" placeholder="Enter ISBN number" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none" required />
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Location</label>
                <input type="text" name="location" placeholder="e.g., Floor 1, Shelf A" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none" required />
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">PDF File</label>
            <input type="file" name="pdf_file" accept="application/pdf" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-cyan-500 focus:outline-none cursor-pointer" required />
            <p class="text-xs text-gray-500 mt-2">📄 Only PDF files accepted (max 50MB)</p>
        </div>
        
        <button type="submit" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold py-3 px-8 rounded-lg transition transform hover:translate-y-[-2px] shadow-lg w-full">
            ✅ Upload Book
        </button>
    </form>
</div>
{% endblock %}
